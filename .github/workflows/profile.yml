name: Refresh profile
on:
  push:
    branches: [profile-preview]
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/profile.yml', 'README.md', 'assets/**', 'docs/**']
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
  refresh:
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'profile-preview')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Read public repositories and render assets
        run: node scripts/refresh.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
      - name: Commit refreshed assets
        run: |
          git add -- README.md assets/generated/stats.svg assets/generated/calendar.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public project activity'
          git push

